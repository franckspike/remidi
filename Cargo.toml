[package]
name = "remidi"
version = "0.3.0"
edition = "2024"
description = "Cross-platform MIDI filtering and transformation system tray utility"

[dependencies]
anyhow = "1"
dirs = "6"
eframe = "0.31"
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
midir = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.20"
tray-icon = { version = "0.19", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
] }
