# =============================================================================
# ReMIDI Configuration (config.toml)
# =============================================================================
#
# Default location:
#   - Linux:   ~/.config/remidi/config.toml
#   - Windows: %APPDATA%\remidi\config.toml
#
# ReMIDI supports multiple MIDI pipelines in a single instance:
#   - Virtual ports are named "ReMIDI - <virtual_port>" on Windows,
#     and "<virtual_port>" on Linux (under the "ReMIDI" unified ALSA client).
#   - Multiple pipelines can share the same `virtual_port` (incoming messages
#     on that virtual port are dispatched to all enabled pipelines using it).
#   - Multiple pipelines can write to the same `target_port` (outgoing MIDI
#     packets are synchronized via a shared connection lock).
#
# You can toggle each pipeline's `enabled` state, change its `target_port`
# from the detected system MIDI-out ports, or run its `test` sequence directly
# from the System Tray menu. Changes to `enabled` and `target_port` made in the
# tray menu are automatically saved back to this file.
#
# MESSAGE FORMAT:
#   Incoming MIDI messages are formatted as uppercase 2-digit hex bytes
#   separated by a single space:
#     2-byte message (e.g. Program Change): "C0 01"
#     3-byte message (e.g. Note On / CC):   "90 3C 7F"
#
# EXPRESSIONS & TEMPLATES (replace & comment):
#   - Capture references: $1, $2 or ${1}, ${2}
#   - Named captures:     (?<ch>[0-9A-Fa-f]) -> ${ch}
#   - Arithmetic:         ${$1 - 1}, ${$1 + 1} (evaluates offset on capture byte)
#   - Formatting:         ${$1:dec} (decimal), ${$1:hex} (hex byte), ${$1:ch} (channel 1..16)
#   - In comment:         ${out.1}, ${out.2}, ${out.2:dec} (final output bytes)
#                         ${in.1}, ${in.2}, ${in.2:dec} (original input bytes)
#
# UNMATCHED MESSAGES:
#   Messages that do not match any rule in a pipeline are ignored (filtered out).
#   If you want a pass-through fallback at the end of a pipeline's rules, add:
#     match = "(.*)"
#     replace = "$1"
#
# TEST SEQUENCE FORMAT:
#   Each pipeline can define a `test` sequence as an array of strings:
#     - "C0 01"      -> sends hex bytes "C0 01" into the pipeline
#     - "sleep 1000" -> waits 1000 milliseconds before the next step
# =============================================================================


[[pipelines]]
id = "Soleman"
enabled = true
virtual_port = "Main"
target_port = "AIR 192 8:AIR 192 8 MIDI 1 16:0"
test = ["C0 01", "sleep 1000", "C0 04"]

  [[pipelines.rules]]
  match = 'C0 (\w\w)'
  replace = "90 $1 7F"
  debounce_ms = 500
  comment = "Scene Change ${$1:dec}"

  [[pipelines.rules]]
  match = '90 01 \w\w'
  replace = "B0 50 00"
  debounce_ms = 0
  comment = "Tap Tempo"


[[pipelines]]
id = "G-Major"
enabled = false
virtual_port = "Main"
target_port = "AIR 192 8:AIR 192 8 MIDI 1 16:0"
test = ["C0 01", "sleep 1000", "C0 04"]

  [[pipelines.rules]]
  match = 'C0 (\w\w)'
  replace = "C1 ${$1 - 1}"
  debounce_ms = 500
  comment = "Patch ${$1:dec}"

